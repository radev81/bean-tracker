<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beans Tracker</title>

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="/beans/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/beans/favicon.svg" />
    <link rel="shortcut icon" href="/beans/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/beans/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Beans Tracker" />

    <!-- Apply saved theme before React renders to avoid flash -->
    <script>
      (function () {
        var t = localStorage.getItem("bt-theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>

    <!-- GitHub Pages routing fix -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>

    <!-- PWA -->
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#B86A00" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
